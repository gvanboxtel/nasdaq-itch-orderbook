name: Claude review

# One full review when a pull request is ready; ask for another with @claude (claude.yml).
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Work as the reviewer described in CLAUDE.md, against its standards and the linked issue's
            acceptance criteria, using the vocabulary in CONTEXT.md.
            Post each finding as an inline comment on the line it concerns.
            Finish with one summary comment on the pull request (gh pr comment).
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
