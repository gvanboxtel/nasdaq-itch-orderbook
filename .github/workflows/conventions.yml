name: Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! $BRANCH =~ ^[0-9]+-[a-z0-9-]+$ ]]; then
            echo "::error::Branch '$BRANCH' must be <issue>-<slug>, for example 12-decode-messages"
            exit 1
          fi

      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-commit-msg.sh "$TITLE"
